<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Debt Tracker</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--bg:#f2f4f8;--card:#fff;--text:#1b2433;--muted:#6b7686;--line:#e3e7ee;--primary:#4f46e5;--soft:#eceafd;--green:#16a34a;--red:#dc2626;--redsoft:#fdecec}
@media (prefers-color-scheme:dark){:root{--bg:#0f141c;--card:#1a212d;--text:#eef1f6;--muted:#98a2b3;--line:#2a3342;--primary:#8b85ff;--soft:#262456;--red:#ff7b7b;--redsoft:#3a1f23}}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
#app{max-width:440px;margin:auto}
h3{margin:0 0 14px;font-size:22px}
small{display:block;color:var(--muted);font-size:12px}
.store{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 10px 24px rgba(79,70,229,.3)}
.store label{font-size:12px;letter-spacing:1px;opacity:.8}
.store input{width:100%;background:transparent;border:none;outline:none;color:#fff;font-size:24px;font-weight:700;padding:4px 0 12px;border-bottom:1px solid rgba(255,255,255,.3)}
.td{margin-top:14px;font-size:14px;opacity:.95}.td b{display:block;font-size:28px;margin-top:2px}.td small{color:#fff;opacity:.8}
.eye{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:999px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;margin-left:8px;vertical-align:middle}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.mb{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 10px;text-align:center;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.mb span{display:block;font-size:30px;margin-bottom:8px}.mb:active{transform:scale(.97)}
.back{background:var(--soft);color:var(--primary);border:none;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:600;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.fl{font-size:13px;font-weight:600;color:var(--muted);display:block;margin:0 0 6px}
.card .f+.fl{margin-top:14px}
.f{width:100%;padding:13px;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;outline:none;font-family:inherit}
.f:focus{border-color:var(--primary)}
.ih,.ir{display:grid;grid-template-columns:56px 1fr 96px;gap:8px}
.ih{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;padding:0 4px}.ir{margin-bottom:8px}.ir .f{padding:12px 8px;text-align:center}
.pm,.two{display:flex;gap:8px}.pm{margin-top:6px}
.sm{flex:1;padding:12px;border:none;border-radius:12px;background:var(--soft);color:var(--primary);font-size:15px;font-weight:600}
.sm.red{background:var(--redsoft);color:var(--red);flex:0 0 auto}
.sm.wa{background:#dcf8e6;color:#128c4a;font-size:14px;padding:12px 4px;white-space:nowrap}
a.sm{display:flex;align-items:center;justify-content:center;text-decoration:none}
.tb{display:flex;justify-content:space-between;align-items:center;background:var(--redsoft);color:var(--red);border-radius:14px;padding:14px 16px;font-weight:700;font-size:18px;margin-bottom:14px}
.ok{width:100%;padding:16px;background:var(--green);color:#fff;border:none;border-radius:14px;font-size:18px;font-weight:700;margin-bottom:14px;box-shadow:0 6px 16px rgba(22,163,74,.3)}
.ok.blue{background:var(--primary);box-shadow:none}
.ok.wag{background:#dcf8e6;color:#128c4a;box-shadow:none}
.li,.le{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child,.le:last-child{border-bottom:0}
.li .n{color:var(--muted);width:20px;font-size:14px}.li .nm{flex:1;font-weight:600;cursor:pointer}.li .am{font-weight:700;color:var(--red)}
.le>div{flex:1}.pl{color:var(--red);font-weight:700}.mn{color:var(--green);font-weight:700}
.ck{width:40px;height:40px;border-radius:50%;border:2px solid var(--green);background:none;color:var(--green);font-size:18px;font-weight:700}
.ib{background:none;border:none;font-size:18px;color:var(--muted);padding:4px}
.empty{text-align:center;color:var(--muted);padding:16px}.over{color:var(--red);font-weight:600}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .45s}
.bad{border-color:var(--red)!important;background:var(--redsoft)!important}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:90%;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.box{background:var(--card);color:var(--text);border-radius:18px;padding:18px;width:100%;max-width:400px}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.avbig{width:96px;height:96px;font-size:34px;border:2px dashed var(--primary);cursor:pointer;margin:0 auto 6px;position:relative}
.avbig.has{border-style:solid}
.avcap{text-align:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.recdot{width:70px;height:70px;border-radius:50%;background:var(--red);margin:6px auto 12px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1);opacity:1}}
body{padding-bottom:96px}
.store{position:relative}
.bk input{width:22px;height:22px;flex:0 0 auto}
.anl{display:inline-flex;align-items:center;gap:8px;margin:12px 0 2px;background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:700}
.anl span{font-size:18px}
.antabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.antabs button{flex:1;padding:13px 4px;border:none;background:none;color:var(--muted);font-size:14px;font-weight:700;border-bottom:3px solid transparent}
.antabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.anm{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px;font-weight:700;font-size:17px}
.anm button{background:var(--soft);color:var(--primary);border:none;border-radius:50%;width:38px;height:38px;font-size:20px;font-weight:700}
.anm button.off{opacity:.3}
.stat{position:absolute;top:14px;right:14px;width:112px;background:rgba(255,255,255,.14);border-radius:16px;padding:8px 6px;text-align:center}
.stat svg{display:block;margin:0 auto}
.stat .lg{font-size:11px;font-weight:700;line-height:1.5}
.stat .tg{display:flex;gap:4px;justify-content:center;margin-top:5px}
.stat .tg button{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:3px 8px}
.stat .tg button.on{background:#fff;color:#4f46e5}
.pbar{height:6px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
#nav button{background:none;border:none;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;min-width:56px}
#nav button span{font-size:22px;line-height:1}
#nav button.on{color:var(--primary)}
#nav .plus span{background:var(--primary);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-22px;box-shadow:0 6px 16px rgba(79,70,229,.4)}
@keyframes pg{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes pgb{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.pg{animation:pg .22s ease-out}.pgb{animation:pgb .22s ease-out}
@media (prefers-reduced-motion:reduce){.pg,.pgb{animation:none}}
.pk{display:block;width:100%;margin-bottom:10px;padding:14px;font-size:16px}
.sum{display:flex;gap:10px;margin-bottom:14px}.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="nav"></div>

<script>
/* ===== 1. DATA (stored on this phone) ===== */
var KEY = "storeDebtApp", DKEY = "storeDebtDraft", UKEY = "storeDebtUndo";
function load(k, fb) { try { var v = JSON.parse(localStorage.getItem(k)); return v || fb; } catch (e) { return fb; } }
var warnedFull = false;
function put(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); }
    catch (e) {
        if (!warnedFull) { warnedFull = true; alert("This app's storage on your phone is full, so the latest changes may NOT be saved. Tap Backup now, then remove some customer photos."); }
    }
}
var S = load(KEY, { store: "My Small Store", debtors: [], plans: { goals: "", items: [] } });
function fix() { S.products = S.products || []; S.plans = S.plans || { goals: "", items: [] }; }
fix();
var draft = load(DKEY, null);
var undoS = null; try { localStorage.removeItem(UKEY); } catch (e) {}
var sortBy = "big";
function save() { put(KEY, S); }
// snap() remembers the data before a change, so "Undo" can bring it back
function snap() { undoS = JSON.stringify(S); }
function undo() {
    if (!undoS) return;
    S = JSON.parse(undoS); fix(); undoS = null;
    try { localStorage.removeItem(UKEY); } catch (e) {}
    save(); show("home");
}

/* ===== 2. HELPERS ===== */
function money(n) { return "₦" + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function uid() { return Date.now() * 1000 + Math.floor(Math.random() * 1000); }
function nowLocal() { var n = new Date(); n.setMinutes(n.getMinutes() - n.getTimezoneOffset()); return n.toISOString().slice(0, 16); }
function today() { return nowLocal().slice(0, 10); }
function fmtDate(s) { return s ? new Date(s).toLocaleString([], { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : ""; }
function find(id) { return S.debtors.filter(function (d) { return d.id == id; })[0]; }
function bal(d) { return d.entries.reduce(function (t, e) { return t + (e.type == "pay" ? -e.amount : e.amount); }, 0); }
function active() { return S.debtors.filter(function (d) { return !d.cleared; }); }
function debts(d) { return d.entries.filter(function (e) { return e.type == "debt"; }); }
function oldest(d) { var x = debts(d).map(function (e) { return e.date; }).sort()[0]; return x ? new Date(x).getTime() : Date.now(); }
function ageDays(d) { return Math.floor((Date.now() - oldest(d)) / 86400000); }
function overdue(d) { return debts(d).some(function (e) { return e.due && e.due < today(); }); }
// Nigerian numbers: 0803... becomes 234803...
function waNum(p) { var n = String(p || "").replace(/\D/g, ""); return n.indexOf("0") == 0 ? "234" + n.slice(1) : n; }
function wa(d, msg) { window.open("https://wa.me/" + waNum(d.phone) + "?text=" + encodeURIComponent(msg)); }

// ---- Customer photos ----
function nameHue(n) { var h = 0; for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 360; return h; }
function avatarHtml(photo, name, cls, click) {
    var nm0 = name && name.trim() ? name.trim() : "";
    var inner = photo ? '<img src="' + photo + '" alt="">' : (nm0 ? esc(nm0.charAt(0).toUpperCase()) : '📷');
    var st = (!photo && nm0) ? ' style="background:hsl(' + nameHue(nm0.toLowerCase()) + ',60%,42%);color:#fff"' : '';
    return '<div class="av ' + (cls || '') + (photo ? ' has' : '') + '"' + st + (click ? ' onclick="' + click + '"' : '') + '>' + inner + '</div>';
}
function photoOf(d) { return d && d.photo ? d.photo : ""; }
function draftPhoto() {
    if (draft && draft.photo) return draft.photo;
    var n = (draft && draft.name || "").trim().toLowerCase();
    var d = n ? S.debtors.filter(function (x) { return x.name.toLowerCase() == n; })[0] : null;
    return photoOf(d);
}
function refreshDraftAv() {
    var el = document.getElementById("avp"); if (!el) return;
    el.innerHTML = avatarHtml(draftPhoto(), draft.name, "avbig", "viewPhoto('draft')");
}
// shrink the picture so it does not fill up the phone's storage
function shrinkImage(file, cb) {
    var r = new FileReader();
    r.onload = function () {
        var im = new Image();
        im.onload = function () {
            var size = 320, c = document.createElement("canvas"); c.width = c.height = size;
            var m = Math.min(im.width, im.height), sx = (im.width - m) / 2, sy = (im.height - m) / 2;
            c.getContext("2d").drawImage(im, sx, sy, m, m, 0, 0, size, size);
            cb(c.toDataURL("image/jpeg", 0.8));
        };
        im.onerror = function () { alert("Could not read that picture"); };
        im.src = r.result;
    };
    r.readAsDataURL(file);
}
function pickPhoto(target) {
    var has = target == "draft" ? !!draftPhoto() : !!photoOf(find(target));
    var ov = document.createElement("div");
    ov.className = "ov";
    ov.innerHTML = '<div class="box"><h3>Customer photo</h3>' +
        '<button class="sm pk" id="pk1">📷 Take a photo</button>' +
        '<button class="sm pk" id="pk2">🖼️ Choose from gallery</button>' +
        (has ? '<button class="sm red pk" id="pk3" style="flex:none">🗑 Remove photo</button>' : '') +
        '<button class="sm pk" id="pk0" style="background:var(--bg);color:var(--muted);margin-bottom:0">Cancel</button>' +
        '<input type="file" id="fcam" accept="image/*" capture="environment" style="display:none">' +
        '<input type="file" id="fgal" accept="image/*" style="display:none"></div>';
    document.body.appendChild(ov);
    function got(inp) {
        inp.onchange = function () {
            var f = inp.files && inp.files[0]; if (!f) return;
            shrinkImage(f, function (data) { setPhoto(target, data); ov.remove(); });
        };
    }
    got(document.getElementById("fcam")); got(document.getElementById("fgal"));
    document.getElementById("pk1").onclick = function () { document.getElementById("fcam").click(); };
    document.getElementById("pk2").onclick = function () { document.getElementById("fgal").click(); };
    document.getElementById("pk0").onclick = function () { ov.remove(); };
    if (has) document.getElementById("pk3").onclick = function () { setPhoto(target, ""); ov.remove(); };
}
function setPhoto(target, data) {
    if (target == "draft") {
        draft.photo = data; put(DKEY, draft);
        if (!data) {
            var n = (draft.name || "").trim().toLowerCase();
            S.debtors.forEach(function (x) { if (x.name.toLowerCase() == n) { x.photo = ""; } });
            save();
        }
        refreshDraftAv();
    } else {
        snap(); find(target).photo = data; save(); show("ledger", target);
    }
}

// Full-screen picture. target = "draft" or a customer id
function viewPhoto(target) {
    var photo = target == "draft" ? draftPhoto() : photoOf(find(target));
    var name = target == "draft" ? (draft.name || "") : find(target).name;
    if (!photo) { pickPhoto(target); return; }
    var ov = document.createElement("div");
    ov.className = "ov";
    ov.style.background = "rgba(0,0,0,.92)";
    ov.innerHTML = '<div class="box" style="background:transparent;padding:0;text-align:center">' +
        '<img src="' + photo + '" alt="" style="width:100%;max-height:68vh;object-fit:contain;border-radius:14px">' +
        '<div style="color:#fff;font-weight:700;font-size:18px;margin:12px 0">' + esc(name) + '</div>' +
        '<div class="two"><button class="sm" id="pvc">Close</button><button class="sm" id="pvh">📷 Change photo</button></div></div>';
    document.body.appendChild(ov);
    ov.onclick = function (e) { if (e.target === ov) ov.remove(); };
    document.getElementById("pvc").onclick = function () { ov.remove(); };
    document.getElementById("pvh").onclick = function () { ov.remove(); pickPhoto(target); };
}

// List of today's purchases (kind "debt") or payments (kind "pay")
function vToday(kind) {
    var t = today(), pay = kind == "pay", rows = [], tot = 0;
    S.debtors.forEach(function (d) {
        d.entries.forEach(function (e) {
            if (e.date.slice(0, 10) != t || (e.type == "pay") != pay) return;
            tot += e.amount; rows.push({ d: d, e: e });
        });
    });
    rows.sort(function (a, b) { return a.e.date < b.e.date ? 1 : -1; });
    var list = rows.map(function (r) {
        var e = r.e, what = pay ? "Payment" : esc(e.item || "Item") + (e.qty > 1 ? " ×" + e.qty : "");
        return '<div class="li">' + avatarHtml(photoOf(r.d), r.d.name, "", "viewPhoto(" + r.d.id + ")") +
            '<span class="nm" onclick="show(\'ledger\',' + r.d.id + ')">' + esc(r.d.name) + '<small>' + what + ' · ' + e.date.slice(11, 16) + '</small></span>' +
            '<span class="' + (pay ? "mn" : "pl") + '">' + money(e.amount) + '</span></div>';
    }).join("");
    return '<button class="back" onclick="show(\'home\')">← Back</button><h3>' + (pay ? "Collected today" : "Debt given today") + '</h3>' +
        '<div class="tb"><span>Total</span><span>' + money(tot) + '</span></div>' +
        '<div class="card">' + (list || '<div class="empty">Nothing yet today</div>') + '</div>';
}

function renameCust(id) {
    var d = find(id);
    askForm("Rename customer", [{ label: "Customer name", value: d.name }], function (v) {
        var n = v[0].trim();
        if (!n) { flag("af0", "Enter a name"); return false; }
        var dup = S.debtors.filter(function (x) { return x.id != id && x.name.toLowerCase() == n.toLowerCase(); })[0];
        if (dup) { flag("af0", "Another customer already has this name"); return false; }
        snap(); d.name = n; save(); show("ledger", id);
    });
}
function deleteCust(id) {
    var d = find(id);
    if (!confirm("Delete " + d.name + " and ALL their records? Use Undo on the Home screen straight after if this was a mistake.")) return;
    snap(); S.debtors = S.debtors.filter(function (x) { return x.id != id; }); save(); show("home");
}

// ---- Voice notes (20 s) and short compressed videos (10 s) ----
// Recordings are kept in the phone's IndexedDB (room for more than the main records); only a small tag is kept in the records.
var _db = null;
function mdb(cb) {
    if (_db) return cb(_db);
    try {
        var rq = indexedDB.open("debtMedia", 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore("m"); };
        rq.onsuccess = function () { _db = rq.result; cb(_db); };
        rq.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
}
function mPut(id, blob, cb) {
    mdb(function (db) {
        if (!db) return cb(false);
        var tx = db.transaction("m", "readwrite"); tx.objectStore("m").put(blob, id);
        tx.oncomplete = function () { cb(true); }; tx.onerror = function () { cb(false); }; tx.onabort = function () { cb(false); };
    });
}
function mGet(id, cb) {
    mdb(function (db) {
        if (!db) return cb(null);
        var r = db.transaction("m").objectStore("m").get(id);
        r.onsuccess = function () { cb(r.result || null); }; r.onerror = function () { cb(null); };
    });
}
function mDel(id) { mdb(function (db) { if (db) db.transaction("m", "readwrite").objectStore("m").delete(id); }); }
function mKeys(cb) {
    mdb(function (db) {
        if (!db) return cb([]);
        var r = db.transaction("m").objectStore("m").getAllKeys();
        r.onsuccess = function () { cb(r.result); }; r.onerror = function () { cb([]); };
    });
}
// removes recordings that no purchase or draft uses any more
function cleanMedia() {
    mKeys(function (keys) {
        var used = {};
        S.debtors.forEach(function (d) { d.entries.forEach(function (e) { (e.media || []).forEach(function (m) { used[m.id] = 1; }); }); });
        ((draft && draft.media) || []).forEach(function (m) { used[m.id] = 1; });
        keys.forEach(function (k) { if (!used[k]) mDel(k); });
    });
}
function fmtSecs(n) { n = n || 0; return "0:" + (n < 10 ? "0" : "") + n; }

var recCancelFn = null;
function recCancel() { if (recCancelFn) { recCancelFn(); recCancelFn = null; } }
// kind "a" = voice (max 20 s), "v" = video (max 10 s, small and low quality on purpose)
function record(kind, onDone) {
    if (!navigator.mediaDevices || !window.MediaRecorder) { alert("Recording is not supported in this browser."); return; }
    var max = kind == "a" ? 20 : 10;
    var cons = kind == "a" ? { audio: true } : { audio: true, video: { facingMode: "environment", width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 12, max: 15 } } };
    navigator.mediaDevices.getUserMedia(cons).then(function (stream) {
        var ov = document.createElement("div"); ov.className = "ov";
        ov.innerHTML = '<div class="box" style="text-align:center"><h3>' + (kind == "a" ? "🎙 Voice note" : "🎥 Video") + '</h3>' +

function track(id, arg, fromBack) {

    try {
        if (!fromBack) {
            if (firstShow || (id == curId && arg == curArg)) history.replaceState(st, "");

// collects the rows for the chosen tab and month
function anData() {
    var rows = [], p = anM.split("-"), days = new Date(+p[0], +p[1], 0).getDate();
    S.debtors.forEach(function (d) {
        if (anTab == "paid") {
            if (!d.cleared || !d.entries.length) return;
            var last = d.entries.reduce(function (m, e) { return e.date > m ? e.date : m; }, "");
            if (last.slice(0, 7) != anM) return;
            rows.push({ d: d, e: null, day: last.slice(0, 10), amt: debts(d).reduce(function (t, e) { return t + e.amount; }, 0) });
        } else {
            d.entries.forEach(function (e) {
                if (e.date.slice(0, 7) != anM || (e.type == "pay") != (anTab == "got")) return;
                rows.push({ d: d, e: e, day: e.date.slice(0, 10), amt: e.amount });
            });

    });

    });
    var cust = Object.keys(byC).map(function (k) { return byC[k]; }).sort(function (a, b) { return b.amt - a.amt; });
    return { rows: rows, days: days, byDay: byDay, total: total, cust: cust };
}
function anNice(max) {
    if (max <= 0) return 1000;
    var pw = Math.pow(10, Math.floor(Math.log(max) / Math.LN10)), m = max / pw, steps = [1, 2, 4, 5, 10], i = 0;
    while (steps[i] < m) i++;

}
function anChart(D) {

function anDonut(D) {

    if (key == "item" && !r.amount) {   // saved product? fill the price automatically
        var p = S.products.filter(function (x) { return x.name.toLowerCase() == val.trim().toLowerCase(); })[0];
        if (p && !p.custom) { r.unit = p.price; r.amount = String(p.price * (parseFloat(r.qty) || 1)); document.getElementById("a" + i).value = r.amount; }
    }
    if (key == "qty" && r.unit) { r.amount = String(r.unit * (parseFloat(val) || 1)); document.getElementById("a" + i).value = r.amount; }
    if (key == "amount") delete r.unit;
    put(DKEY, draft); calcTotal(); offer(i);
}
function findProd(n) {
    n = String(n).trim().toLowerCase();
    return S.products.filter(function (x) { return x.name.toLowerCase() == n; })[0];
}
function refreshProdList() {
    var el = document.getElementById("prods");
    if (el) el.innerHTML = S.products.map(function (x) { return '<option value="' + esc(x.name) + '">'; }).join("");
}
// Under a row, offer to save a new item as a product
function offer(i) {
    var el = document.getElementById("ps" + i);
    if (!el) return;
    var r = draft.rows[i], n = r.item.trim();
    if (!n || findProd(n)) { el.innerHTML = ""; return; }
    var a = parseFloat(r.amount), q = parseFloat(r.qty) || 1, h = "";
    var st = 'style="font-size:13px;padding:9px 6px"';
    if (a > 0) h += '<button class="sm" ' + st + ' onclick="saveProd(' + i + ',false)">＋ Save product · ' + money(Math.round(a / q * 100) / 100) + ' each</button>';
    h += '<button class="sm" ' + st + ' onclick="saveProd(' + i + ',true)">＋ Save as custom price</button>';
    el.innerHTML = h;
}
// custom = true: price changes every time, so no price is saved
function saveProd(i, custom) {
    var r = draft.rows[i], n = r.item.trim();
    if (!n || findProd(n)) return;
    var item;
    if (custom) {
        item = { name: n, price: 0, custom: true };
    } else {
        var a = parseFloat(r.amount), q = parseFloat(r.qty) || 1;
        if (!(a > 0)) { flag("a" + i, "Enter the amount first"); return; }
        item = { name: n, price: Math.round(a / q * 100) / 100 };
        r.unit = item.price; put(DKEY, draft);
    }
    S.products.push(item); save(); refreshProdList();
    document.getElementById("ps" + i).innerHTML = '<small class="mn">✓ Saved' + (custom ? ' as custom price item' : ' · ' + money(item.price) + ' each') + '</small>';
}
function addRow() { draft.rows.push({ qty: 1, item: "", amount: "" }); put(DKEY, draft); show("add"); }
function delRow() { if (draft.rows.length > 1) { draft.rows.pop(); put(DKEY, draft); show("add"); } }
function calcTotal() {
    var t = draft.rows.reduce(function (s, r) { return s + (parseFloat(r.amount) || 0); }, 0);
    document.getElementById("gt").textContent = money(t);
}
function saveTx() {
    var name = draft.name.trim();
    var rows = draft.rows.filter(function (r) { return parseFloat(r.amount) > 0; });
    if (!name) { flag("cn", "Enter the customer's name first"); return; }
    if (!rows.length) {
        var bad = draft.rows.findIndex(function (r) { return r.item.trim(); });
        flag("a" + (bad > -1 ? bad : 0), bad > -1 ? "Enter the amount for this item" : "Enter at least one item and its amount");
        return;
    }
    snap();
    var d = S.debtors.filter(function (x) { return x.name.toLowerCase() == name.toLowerCase(); })[0];
    if (!d) { d = { id: uid(), name: name, phone: "", cleared: false, entries: [] }; S.debtors.push(d); }
    d.cleared = false;
    if (draft.photo) d.photo = draft.photo;
    rows.forEach(function (r) {
        d.entries.push({ type: "debt", date: draft.dt, due: draft.due, qty: parseFloat(r.qty) || 1, item: r.item.trim(), amount: parseFloat(r.amount), note: (draft.note || "").trim(), media: (draft.media || []).slice() });
    });
    save(); draft = null;
    try { localStorage.removeItem(DKEY); } catch (e) {}
    show("book");
}

/* ===== 5. DEBT BOOK (search + sort) ===== */
function vBook() {
    if (S.sortBy) sortBy = S.sortBy;
    var tot = active().reduce(function (t, d) { return t + bal(d); }, 0);
    return '<button class="back" onclick="show(\'home\')">← Back</button><h3>Debt Book</h3>' +
        '<div class="tb"><span>Total</span><span>' + money(tot) + '</span></div>' +
        '<div class="two" style="margin-bottom:14px"><input id="q" class="f" type="search" placeholder="🔍 Search name..." oninput="refreshBook()">' +
        '<select class="f" style="width:130px" onchange="sortBy=S.sortBy=this.value;save();refreshBook()">' +
        '<option value="big"' + (sortBy == "big" ? " selected" : "") + '>Biggest</option>' +
        '<option value="old"' + (sortBy == "old" ? " selected" : "") + '>Oldest</option>' +
        [["new", "Newest"], ["freq", "Most frequent"], ["od", "Overdue first"], ["small", "Smallest"], ["paid", "Recently paid"], ["least", "Least paid"]].map(function (o) { return '<option value="' + o[0] + '"' + (sortBy == o[0] ? " selected" : "") + '>' + o[1] + '</option>'; }).join("") +
        '<option value="name"' + (sortBy == "name" ? " selected" : "") + '>A–Z</option></select></div>' +
        '<div class="card" id="bl">' + bookRows("") + '</div>' +
        '<button class="ok wag" onclick="shareList()">' + waIcon() + 'Share debt list on WhatsApp</button>';
}
function refreshBook() { document.getElementById("bl").innerHTML = bookRows(document.getElementById("q").value); }
function bookRows(q) {
    q = q.trim().toLowerCase();
    var act = active().filter(function (d) { return d.name.toLowerCase().indexOf(q) > -1; });
    act.sort(function (a, b) {
        if (sortBy == "old") return oldest(a) - oldest(b);
        if (sortBy == "new") return lastOf(b, "debt").localeCompare(lastOf(a, "debt"));
        if (sortBy == "freq") return buys(b) - buys(a);
        if (sortBy == "od") return odKey(a).localeCompare(odKey(b));
        if (sortBy == "small") return bal(a) - bal(b);
        if (sortBy == "paid") return lastOf(b, "pay").localeCompare(lastOf(a, "pay"));
        if (sortBy == "least") return paidPct(a) - paidPct(b);
        if (sortBy == "name") return a.name.localeCompare(b.name);
        return bal(b) - bal(a);
    });
    var list = act.map(function (d, i) {
        var age = ageDays(d), od = overdue(d);
        return '<div class="li">' + avatarHtml(photoOf(d), d.name, "", "viewPhoto(" + d.id + ")") +
            '<span class="nm" onclick="show(\'ledger\',' + d.id + ')">' + esc(d.name) +
            '<small class="' + (age > 7 || od ? "over" : "") + '">' + age + ' day' + (age == 1 ? '' : 's') + (od ? ' · Overdue' : '') + ' · ' + paidPct(d) + '% paid</small><div class="pbar"><i style="width:' + paidPct(d) + '%"></i></div></span>' +
            '<span class="am">' + money(bal(d)) + '</span>' +
            '<button class="ck" onclick="clearIt(' + d.id + ')">✓</button></div>';
    }).join("");
    return list || '<div class="empty">' + (q ? "No match" : "No active debts") + '</div>';
}
function clearIt(id) {
    var d = find(id);
    if (confirm("Mark " + d.name + " as fully paid and move to Paid Off?")) { snap(); d.cleared = true; save(); show("book"); }
}

/* ===== 6. LEDGER (one customer) ===== */
function vLedger(id) {
    var d = find(id), b = bal(d);
    var rows = d.entries.map(function (e, i) {
        var p = e.type == "pay";
        var t = p ? "Payment" : esc(e.item || "Item") + (e.qty > 1 ? " ×" + e.qty : "");
        return '<div class="le"><div><b>' + t + '</b><small>' + fmtDate(e.date) + (e.due ? ' · due ' + e.due : '') + '</small>' + noteHtml(d, i) + mediaHtml(d, i) + '</div>' +
            '<span class="' + (p ? "mn" : "pl") + '">' + (p ? "−" : "+") + money(e.amount) + '</span>' +
            '<button class="ib" onclick="editEntry(' + id + ',' + i + ')">✎</button>' +
            '<button class="ib" onclick="delEntry(' + id + ',' + i + ')">✕</button></div>';
    }).join("");
    return '<button class="back" onclick="show(\'' + (d.cleared ? 'cleared' : 'book') + '\')">← Back</button>' +
        '<div id="lav">' + avatarHtml(photoOf(d), d.name, "avbig", "viewPhoto(" + id + ")") + '</div><div class="avcap">' + (photoOf(d) ? 'Tap photo to see it full size' : 'Tap the circle to add a photo') + '</div>' +
        '<h3 style="text-align:center">' + esc(d.name) + '</h3>' +
        '<div class="tb"><span>Balance owed</span><span>' + money(b) + '</span></div>' +
        '<div style="margin:-4px 0 14px"><div class="pbar" style="height:8px"><i style="width:' + paidPct(d) + '%"></i></div><small style="margin-top:4px">' + paidPct(d) + '% of all purchases paid back</small></div>' +
        '<div class="card"><label class="fl">Phone number (for WhatsApp)</label>' +
        '<input class="f" id="ph" type="tel" placeholder="e.g. 0803 123 4567" value="' + esc(d.phone || "") + '" oninput="find(' + id + ').phone=this.value;save();setCall(' + id + ')">' +
        '<div class="pm"><button class="sm wa" onclick="remind(' + id + ')">' + waIcon() + 'Remind</button><button class="sm wa" onclick="statement(' + id + ')">' + waIcon() + 'Statement</button><a class="sm wa" id="callbtn" href="tel:' + callNum(d.phone) + '" onclick="return callGo(' + id + ')">📞 Call</a></div></div>' +
        '<div class="card">' + (rows || '<div class="empty">No entries</div>') + '</div>' +
        '<button class="ok blue" onclick="openAddFor(' + id + ')">＋ Add purchase</button>' +
        '<button class="sm" style="width:100%;margin-bottom:14px" onclick="repeatLast(' + id + ')">🔁 Repeat last order</button>' +
        '<div class="card"><label class="fl">Record what happened (saved with the last purchase)</label><div class="pm"><button class="sm" onclick="recLedger(' + id + ',\'a\')">🎙 Voice (20s)</button><button class="sm" onclick="recLedger(' + id + ',\'v\')">🎥 Video (10s)</button></div></div>' +
        '<div class="card"><label class="fl">Record a payment (minus)</label><div class="two">' +
        '<input id="pay" class="f" type="number" inputmode="decimal" placeholder="Amount paid">' +
        '<button class="sm red" onclick="pay(' + id + ')">－ Pay</button></div></div>' +
        '<div class="two" style="margin-bottom:14px"><button class="sm" onclick="renameCust(' + id + ')">✏️ Rename</button><button class="sm red" style="flex:1" onclick="deleteCust(' + id + ')">🗑 Delete customer</button></div>';
}
function openAddFor(id) { openAdd(find(id).name); }
function remind(id) {
    var d = find(id);
    wa(d, "Hello " + d.name + ", this is a reminder from " + S.store + ". You owe " + money(bal(d)) + ". Please pay when you can. Thank you.");
}
function statement(id) {
    var d = find(id);
    var lines = d.entries.map(function (e, i) {
        var day = e.date.slice(0, 10), pr = d.entries[i - 1];
        if (e.type == "pay") return day + "  Payment  -" + money(e.amount);
        var l = day + "  " + (e.item || "Item") + (e.qty > 1 ? " x" + e.qty : "") + "  " + money(e.amount);
        if (e.note && !(pr && pr.note == e.note && pr.date == e.date)) l += "\n   Note: " + e.note;
        return l;
    });
    wa(d, S.store + " - Statement for " + d.name + "\n\n" + lines.join("\n") + "\n\nBalance owed: " + money(bal(d)));
}
function recheck(d) { d.cleared = bal(d) <= 0; save(); show("ledger", d.id); }
function editEntry(id, i) {
    var d = find(id), e = d.entries[i], isDebt = e.type == "debt";
    var fields = isDebt ? [{ label: "Item name", value: e.item }, { label: "Amount (₦)", value: e.amount, type: "number" }, { label: "Note: what happened?", value: e.note || "" }]
                        : [{ label: "Amount (₦)", value: e.amount, type: "number" }];
    askForm(isDebt ? "Edit purchase" : "Edit payment", fields, function (v) {
        var a = parseFloat(v[isDebt ? 1 : 0]);
        if (!(a > 0)) { flag("af" + (isDebt ? 1 : 0), "Enter a valid amount"); return false; }
        snap(); e.amount = a;
        if (isDebt) {
            e.item = v[0].trim();
            var oldNote = e.note || "", nn = v[2].trim(), day = e.date;
            d.entries.forEach(function (x) { if (x.type == "debt" && x.date == day && (x.note || "") == oldNote) x.note = nn; });
        }
        recheck(d);
    });
}
function delEntry(id, i) {
    var d = find(id);
    if (!confirm("Delete this entry?")) return;
    snap(); d.entries.splice(i, 1); recheck(d);
}
function pay(id) {
    var d = find(id), v = parseFloat(document.getElementById("pay").value);
    if (!(v > 0)) { flag("pay", "Enter the amount paid"); return; }
    snap(); d.entries.push({ type: "pay", date: nowLocal(), amount: v });
    if (bal(d) <= 0) { d.cleared = true; save(); alert(d.name + " has fully paid. Moved to Paid Off."); show("cleared"); }
    else { save(); show("ledger", id); }
}

/* ===== 7. CLEARED ===== */
function vCleared() {
    return '<button class="back" onclick="show(\'home\')">← Back</button><h3>Paid Off</h3>' +
        '<input id="cq" class="f" type="search" placeholder="🔍 Search name..." style="margin-bottom:14px" oninput="document.getElementById(\'cl\').innerHTML=clearedRows(this.value)">' +
        '<div class="card" id="cl">' + clearedRows("") + '</div>';
}
function clearedRows(q) {
    q = q.trim().toLowerCase();
    var done = S.debtors.filter(function (d) { return d.cleared && d.name.toLowerCase().indexOf(q) > -1; });
    var list = done.map(function (d, i) {
        var paid = debts(d).reduce(function (t, e) { return t + e.amount; }, 0);
        return '<div class="li">' + avatarHtml(photoOf(d), d.name, "", "viewPhoto(" + d.id + ")") + '<span class="nm" onclick="show(\'ledger\',' + d.id + ')">' + esc(d.name) + '</span>' +
            '<span class="mn">' + money(paid) + '</span>' +
            '<button class="sm" style="flex:0 0 auto;padding:8px 10px" onclick="addBack(' + d.id + ')">Add back</button></div>';
    }).join("");
    return list || '<div class="empty">' + (q ? "No match" : "Nobody has paid off yet") + '</div>';
}
function addBack(id) { snap(); find(id).cleared = false; save(); show("ledger", id); }

/* ===== 8. PLANS + PRODUCTS ===== */
function vPlans() {
    var t = today();
    var items = S.plans.items.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var list = items.map(function (p) {
        return '<div class="le"><div><b>' + esc(p.text) + '</b><small class="' + (p.date && p.date < t ? "over" : "") + '">' + (p.date || "No date") + '</small></div>' +
            '<button class="sm red" onclick="delPlan(' + p.id + ')">✕</button></div>';
    }).join("");
    var prods = S.products.map(function (p, i) {
        return '<div class="le"><div><b>' + esc(p.name) + '</b></div><span>' + (p.custom ? 'Custom price' : money(p.price)) + '</span>' +
            '<button class="sm" style="flex:0 0 auto;padding:8px 12px" onclick="editProd(' + i + ')">✏️ Edit</button>' +
            '<button class="sm red" onclick="delProd(' + i + ')">✕</button></div>';
    }).join("");
    return '<button class="back" onclick="show(\'home\')">← Back</button><h3>Plans</h3>' +
        '<div class="card"><label class="fl">Business goals &amp; notes</label>' +
        '<textarea class="f" rows="4" oninput="S.plans.goals=this.value;save()">' + esc(S.plans.goals) + '</textarea></div>' +
        '<div class="card"><label class="fl">Payment promises</label>' +
        '<input id="pt" class="f" placeholder="Who promised to pay what?">' +
        '<input id="pdt" class="f" type="date" style="margin-top:8px">' +
        '<button class="sm" style="width:100%;margin-top:8px" onclick="addPlan()">＋ Add</button>' +
        (list ? '<div style="margin-top:10px">' + list + '</div>' : '') + '</div>' +
        '<div class="card"><label class="fl">My products (price fills in automatically)</label>' +
        '<div class="two"><input id="pn" class="f" placeholder="Item e.g. Ice water"><input id="pp" class="f" type="number" inputmode="decimal" placeholder="Price" style="width:110px"></div>' +
        '<label style="display:block;margin-top:10px;font-size:14px"><input type="checkbox" id="pc"> Price changes each time (custom price)</label>' +
        '<button class="sm" style="width:100%;margin-top:8px" onclick="addProd()">＋ Save product</button>' +
        (prods ? '<div style="margin-top:10px">' + prods + '</div>' : '') + '</div>';
}
function addPlan() {
    var t = document.getElementById("pt").value.trim();
    if (!t) { flag("pt", "Write the promise first"); return; }
    S.plans.items.push({ id: uid(), text: t, date: document.getElementById("pdt").value });
    save(); show("plans");
}
function delPlan(id) { S.plans.items = S.plans.items.filter(function (p) { return p.id != id; }); save(); show("plans"); }
function addProd() {
    var n = document.getElementById("pn").value.trim(), p = parseFloat(document.getElementById("pp").value);
    var c = document.getElementById("pc").checked;
    if (!n) { flag("pn", "Enter the item name"); return; }
    if (!c && !(p > 0)) { flag("pp", "Enter the price, or tick custom price"); return; }
    if (findProd(n)) { alert("That product is already saved. Use Edit to change it."); return; }
    S.products.push(c ? { name: n, price: 0, custom: true } : { name: n, price: p });
    save(); show("plans");
}
function delProd(i) { S.products.splice(i, 1); save(); show("plans"); }
// Change a product's name or price without deleting it
function editProd(i) {
    var p = S.products[i];
    askForm("Edit product", [{ label: "Item name", value: p.name }, { label: "Price (₦). Leave empty for custom price", value: p.custom ? "" : p.price, type: "number" }], function (v) {
        var pr = parseFloat(v[1]);
        if (!v[0].trim()) { flag("af0", "Enter the item name"); return false; }
        p.name = v[0].trim();
        if (pr > 0) { p.price = pr; delete p.custom; } else { p.price = 0; p.custom = true; }
        save(); show("plans");
    });
}

/* ===== 9. START ===== */
function start() {
    show("home");
    if (!draftEmpty()) {
        setTimeout(function () {
            if (confirm("You have an unsaved draft. Restore it?")) show("add");
            else { draft = null; try { localStorage.removeItem(DKEY); } catch (e) {} }
        }, 300);
    }
}
if (S.pin) show("lock"); else start();
setTimeout(cleanMedia, 4000);

// Makes the app installable and usable offline
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
</body>
